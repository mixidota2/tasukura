name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/check_installed_wheel.py"
      - "pyproject.toml"
      - "uv.lock"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/check_installed_wheel.py"
      - "pyproject.toml"
      - "uv.lock"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".github/workflows/ci.yml"

env:
  # Fail on stale project metadata instead of silently rewriting uv.lock.
  UV_LOCKED: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v

  test-wheel-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Build the checked-out wheel
        run: uv build --wheel --python ${{ matrix.python-version }} --out-dir "$RUNNER_TEMP/tasukura-wheel"
      - name: Install wheel and current dependencies separately
        run: |
          uv venv --python ${{ matrix.python-version }} "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$RUNNER_TEMP"/tasukura-wheel/*.whl 'pytest>=9.0.2'
          uv pip freeze --python "$RUNNER_TEMP/wheel-venv/bin/python"
      - name: Check wheel origin and run canonical tests
        env:
          PYTHONPATH: ""
        run: '"$RUNNER_TEMP/wheel-venv/bin/python" scripts/check_installed_wheel.py'

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Type check with ty
        run: uv run ty check src/ scripts/
